<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phim lẻ | RoPhim</title>
    <meta name="description" content="Xem phim lẻ mới nhất, phim chiếu rạp Vietsub, thuyết minh chất lượng cao trên RoPhim." />
    <meta name="theme-color" content="#191b24" />
    <link rel="icon" type="image/svg+xml" href="./assets/images/logos/ro-icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />

    <script src="./js/components.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/catalog.js" defer></script>
  </head>

  <body>
    <div id="header-placeholder"></div>

    <main class="page-container catalog-page" data-catalog="single">
      <section class="mt-3 mb-4">
        <h1 class="section-title">
          <i id="catalog-icon" class="fa-solid fa-film"></i>
          <span id="catalog-title">Phim lẻ</span>
        </h1>

        <div class="movie-grid" id="catalog-grid"></div>

        <nav class="pagination" aria-label="Phân trang" hidden>
          <button type="button" class="page-btn" id="firstPage" title="Về trang đầu" aria-label="Về trang đầu">
            <i class="fa-solid fa-angles-left"></i>
          </button>
          <button type="button" class="page-btn" id="prevPage" title="Trang trước" aria-label="Trang trước">
            <i class="fa-solid fa-angle-left"></i>
          </button>
          <span class="page-info">
            Trang <strong id="currentPage">1</strong> /
            <strong id="totalPage">1</strong>
          </span>
          <button type="button" class="page-btn" id="nextPage" title="Trang sau" aria-label="Trang sau">
            <i class="fa-solid fa-angle-right"></i>
          </button>
          <button type="button" class="page-btn" id="lastPage" title="Về trang cuối" aria-label="Về trang cuối">
            <i class="fa-solid fa-angles-right"></i>
          </button>
        </nav>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </body>
</html>

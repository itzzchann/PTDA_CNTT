<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết phim | RoPhim</title>
    <meta name="description" content="Thông tin chi tiết phim, danh sách tập, diễn viên trên RoPhim." />
    <meta name="theme-color" content="#191b24" />
    <link rel="icon" type="image/svg+xml" href="./assets/images/logos/ro-icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/detail.css" />

    <script src="./js/components.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/detail.js" defer></script>
  </head>

  <body>
    <div id="header-placeholder"></div>

    <main class="page-container detail-page">
      <section class="mt-3 mb-4">
        <div class="detail-wrap">
          <div id="loading" class="detail-state">
            <i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông tin phim...
          </div>
          <div id="error" hidden></div>

          <div id="content" hidden>
            <div id="heroBanner" class="hero-banner"></div>
            <div class="detail-head">
              <div class="detail-poster">
                <img id="poster" alt="" />
              </div>

              <div class="detail-info">
                <h1 class="section-title mb-0">
                  <i class="fa-solid fa-film"></i>
                  <span id="title"></span>
                </h1>

                <div class="detail-meta" id="meta"></div>
                <a class="btn-watch" id="watchBtn" href="#">
                  <i class="fa-solid fa-play"></i> Xem ngay
                </a>

                <p class="detail-desc" id="desc"></p>

                <div class="detail-row">
                  <b>Thể loại:</b> <span id="categories"></span>
                </div>
                <div class="detail-row">
                  <b>Quốc gia:</b> <span id="countries"></span>
                </div>
                <div class="detail-row">
                  <b>Diễn viên:</b> <span id="actors"></span>
                </div>
                <div class="detail-row">
                  <b>Đạo diễn:</b> <span id="directors"></span>
                </div>
              </div>
            </div>

            <hr class="detail-divider" />

            <h2 class="section-title">
              <i class="fa-solid fa-list"></i> Danh sách tập
            </h2>
            <div id="episodeList" class="episode-grid"></div>

            <section class="movie-section mt-5">
              <div class="section-header">
                <h2 class="section-title">CÓ THỂ BẠN SẼ THÍCH</h2>
              </div>
              <div class="movie-grid" id="recommendationGrid"></div>
            </section>
          </div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </body>
</html>
